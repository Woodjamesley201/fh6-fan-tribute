name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME);
      # AGP downloads any missing platform/build-tools automatically.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the game into the APK assets (fully offline single-player)
        run: |
          set -euo pipefail
          WWW=android/app/src/main/assets/www
          mkdir -p "$WWW/vendor"
          cp index.html game.js sim.js world.js data.js "$WWW/"
          curl -fsSL --retry 4 -o "$WWW/vendor/three.module.js" https://unpkg.com/three@0.160.0/build/three.module.js
          curl -fsSL --retry 4 -o "$WWW/vendor/peerjs.min.js" https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js
          # point the import map and PeerJS loader at the bundled copies
          sed -i 's#https://unpkg.com/three@0.160.0/build/three.module.js#./vendor/three.module.js#' "$WWW/index.html"
          sed -i "s#https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js#./vendor/peerjs.min.js#" "$WWW/game.js"
          grep -q './vendor/three.module.js' "$WWW/index.html"
          grep -q './vendor/peerjs.min.js' "$WWW/game.js"
          ls -la "$WWW" "$WWW/vendor"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FH6-Fan-Tribute.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: FH6-Fan-Tribute-apk
          path: dist/FH6-Fan-Tribute.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/FH6-Fan-Tribute.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "FH6 Fan Tribute — Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed APK built from ${GITHUB_SHA}. Install on Android 8.0+ (enable 'Install unknown apps'). Unofficial fan project — not affiliated with Microsoft, Xbox Game Studios or Playground Games." \
            --latest
